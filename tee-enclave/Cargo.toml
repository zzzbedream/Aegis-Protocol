[package]
name = "aegis-tee-enclave"
version = "0.1.0"
edition = "2021"
description = "Aegis Protocol - Confidential Credit Engine for Vela / AWS Nitro Enclaves"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
hex = "0.4"
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

[lib]
name = "aegis_tee"
path = "src/lib.rs"

[[bin]]
name = "aegis-enclave-node"
path = "src/main.rs"
