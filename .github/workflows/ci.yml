name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vela-app:
    name: Vela guest (TinyGo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vela-app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build trigger artifacts (used by the full-stack E2E)
        run: forge build
        working-directory: vela-app/trigger
      - name: Install TinyGo 0.39.0
        run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb
      - name: gofmt
        # trigger/ holds Foundry git submodules (including Vela's own Go sources): not ours to format.
        run: test -z "$(find . -path ./trigger -prune -o -name '*.go' -print | xargs gofmt -l)"
      - name: go vet
        run: go vet ./... && (cd wasmtest && go vet ./...)
      - name: Unit tests (credit engine)
        run: go test -count=1 ./...
      - name: Build WASM (production)
        run: make production_build
      - name: WASM runtime tests + full-stack E2E (Vela v0.2.0 harness), no skips allowed
        shell: bash
        run: |
          make build
          cd wasmtest
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee test.log
          ! grep -q -- "--- SKIP" test.log

  vela-trigger:
    name: Vela price trigger (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vela-app/trigger
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vv

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
